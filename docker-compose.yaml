services:
  postgres:
    image: postgres:latest
    container_name: postgres-tally
    environment:
      POSTGRES_DB: master
      POSTGRES_USER: admin
      # Secrets come from .env (see .env.example); compose reads it automatically.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      # Read by docker/postgres/init.sh to create the per-service users.
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?set in .env}
      ORCHESTRATOR_DB_PASSWORD: ${ORCHESTRATOR_DB_PASSWORD:?set in .env}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:?set in .env}
      RISK_DB_PASSWORD: ${RISK_DB_PASSWORD:?set in .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set in .env}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=2GB"]
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
      - ./data/postgres/:/var/lib/postgresql/


  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.7.4
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/master
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set in .env}
      # keycloak-user-sync: POSTs new/updated users to user-service (runs on the host, port 8080)
      USER_SYNC_API_URL: http://host.docker.internal:8080/api/v1/clients
      USER_SYNC_API_KEY: ${USER_SYNC_API_KEY:?set in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8091:8080"
    volumes:
      - ./docker/keycloak/realms/:/opt/keycloak/data/import/
      # Run `./gradlew build` in keycloak-user-sync before starting Keycloak.
      # The directory is mounted, not the JAR file: if the file were missing, Docker would create a directory in its place.
      - ./keycloak-user-sync/build/libs/:/opt/keycloak/providers/:ro
    depends_on:
      - postgres

  kafka:
    container_name: kafka
    image: apache/kafka:latest
    ports:
      - "9092:9092"  # Internal listener (Docker network)
      - "9094:9094"  # External listener (host machine)

    environment:
      ############################################
      # KRaft Metadata & Node Identity
      ############################################
      # Unique ID for this Kafka node
      KAFKA_NODE_ID: 1
      # Unique Kafka cluster identifier (required for KRaft mode)
      KAFKA_CLUSTER_ID: 'energy-tracker-cluster-1'
      # Node roles — this instance will act as BOTH a broker and controller
      KAFKA_PROCESS_ROLES: 'broker,controller'

      ############################################
      # Controller Quorum Configuration (Raft)
      ############################################
      # List of controller nodes that form the Raft quorum
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      # Listener name used by controllers for internal Raft communication
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'

      ############################################
      # Network Listeners (Internal, External & Controller)
      ############################################
      # Define all listener endpoints for this Kafka node
      KAFKA_LISTENERS: >
        PLAINTEXT://0.0.0.0:9092,
        EXTERNAL://0.0.0.0:9094,
        CONTROLLER://0.0.0.0:9093

      # What each listener advertises to connecting clients
      # Internal (Docker containers): kafka:9092
      # External (host machine): localhost:9094
      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:9092,
        EXTERNAL://localhost:9094

      # Maps listener names to their security protocols
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        EXTERNAL:PLAINTEXT

      # Which listener brokers should use for internal communication
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'

      ############################################
      #  Single-Node Cluster Safety Settings
      #    (because replication >1 would break)
      ############################################
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      ############################################
      #  Broker Defaults & Quality-of-Life Settings
      ############################################
      # Speed up consumer group startup
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Auto-create topics if they don't already exist
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      # Default number of partitions per topic
      KAFKA_NUM_PARTITIONS: 1

    volumes:
      - ./docker/kafka_data:/var/lib/kafka/data

  kafka-ui:
    container_name: kafka-ui
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "8070:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092  # Use internal Docker network name
      DYNAMIC_CONFIG_ENABLED: 'true'
    restart: unless-stopped

  debezium-connect:
    container_name: debezium-connect
    image: quay.io/debezium/connect:3.7.0.Final
    ports:
      - "8092:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092          # internal listener from your kafka service
      GROUP_ID: tally-connect                # workers with the same id form one Connect cluster
      CONFIG_STORAGE_TOPIC: connect_configs  # where connector configs are stored
      OFFSET_STORAGE_TOPIC: connect_offsets  # how far each connector has read in the WAL
      STATUS_STORAGE_TOPIC: connect_statuses
      # Single Kafka broker, so the internal topics can only have 1 replica (Connect's default is 3).
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Lets connector configs use ${env:VAR} instead of plain-text passwords.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?set in .env}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:?set in .env}
    depends_on:
      - kafka
      - postgres

  user-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: user-service/Dockerfile
    image: tally/user-service:dev
    container_name: user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?set in .env}
      USER_SYNC_API_KEY: ${USER_SYNC_API_KEY:?set in .env}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8091/realms/tally
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/tally/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    volumes:
      - user-service-logs:/application/logs
    depends_on:
      - postgres
      - keycloak
    restart: unless-stopped

  wallet-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: wallet-service/Dockerfile
    image: tally/wallet-service:dev
    container_name: wallet-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wallet_db
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:?set in .env}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8083:8083"
    volumes:
      - wallet-service-logs:/application/logs
    depends_on:
      - postgres
      - kafka
    restart: unless-stopped

  api-gateway:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: tally/api-gateway:dev
    container_name: api-gateway
    environment:
      USER_SERVICE_URL: http://user-service:8080
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8091/realms/tally
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/tally/protocol/openid-connect/certs
    ports:
      - "8081:8081"
    volumes:
      - api-gateway-logs:/application/logs
    depends_on:
      - user-service
      - keycloak
    restart: unless-stopped

volumes:
  user-service-logs:
  wallet-service-logs:
  api-gateway-logs:
